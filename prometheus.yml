global:
  scrape_interval: 5s 
  evaluation_interval: 5s

# Підключення файлу з правилами алертів
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'wind-farm-exporter'
    static_configs:
      - targets: ['wind-exporter:8000'] # Ім'я контейнера з docker-compose